<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Благодарим ви! | LogiTruck</title>
    
    <!-- Основни стилове – адаптирани към твоя сайт -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;          /* тъмна фон – често в логистични сайтове */
            color: #e2e8f0;                     /* светъл текст */
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .thank-you-content {
            text-align: center;
            padding: 80px 20px;
            max-width: 700px;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 1.5rem;
            color: #ffffff;
        }
        p {
            font-size: 1.25rem;
            margin-bottom: 2.5rem;
            color: #cbd5e1;
        }
        .btn-primary {
            display: inline-block;
            background-color: #f59e0b;      /* жълто/оранжево – често акцент в твоите бутони */
            color: #0f172a;
            font-size: 1.2rem;
            font-weight: 600;
            padding: 14px 32px;
            border-radius: 8px;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .btn-primary:hover {
            background-color: #d97706;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.3);
        }
        footer {
            background-color: #0f172a;
            color: #94a3b8;
            text-align: center;
            padding: 20px 0;
            font-size: 0.95rem;
            border-top: 1px solid #1e293b;
        }
    </style>
</head>
<body>

    <main class="container">
        <div class="thank-you-content">
            <h1>Благодарим ви!</h1>
            <p>Получихме вашето запитване успешно.</p>
            <p>Ще се свържем с вас в най-кратък срок.</p>
            
            <a href="https://dmetodiev1.github.io/LogiTruckBG/" class="btn-primary">
                Обратно към началната страница
            </a>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>© 2024–2026 LogiTruck. Всички права запазени.</p>
        </div>
    </footer>

</body>
</html>
